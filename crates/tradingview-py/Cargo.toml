[package]
name = "tradingview-py"
version = "0.3.0"
edition = "2024"
authors = ["Nguyen Thanh Dat <dat.nguyen@bitbytelab.io>"]
license = "MIT"
description = "Python bindings for tradingview-rs"
publish = false

[lib]
name = "_tradingview"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tradingview = { package = "tradingview-rs", path = "../tradingview", default-features = false, features = ["rustls-tls", "user"] }
tracing = "0.1"
futures-util = "0.3"
parking_lot = "0.12"
ustr = "1.1"
chrono = "0.4"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
