[package]
name = "tradingview-rs"
authors = ["Nguyen Thanh Dat <dat.nguyen@bitbytelab.io>"]
version = "0.4.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/bitbytelabio/tradingview-rs"
readme = "../../README.md"
description = "Tradingview datafeed api `tradingview-rs` project."

[lib]
name = "tradingview"
path = "src/lib.rs"

[[bench]]
harness = false
name = "price_iterable_bench"
path = "benches/price_iterable_bench.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
bon = "3"
chrono = { version = "0.4", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["inline", "rayon", "serde"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"], optional = true }
iso_currency = { version = "0.7.1", features = ["with-serde"] }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json", "query", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"], optional = true }
wreq = { version = "=6.0.0-rc.31", features = ["cookies", "form", "json", "query"], optional = true }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
tokio-tungstenite = { version = "0.30", features = ["url"] }
tokio-util = { version = "0.7", features = ["futures-util", "tracing"] }
tracing = "0.1"
url = "2"
urlencoding = "2"
ustr = { version = "1.1.0", features = ["serde"] }

[dev-dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "3"
criterion = { version = "0.8", features = ["html_reports"] }
csv = "1"
dotenv = "0.15"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

[features]
default = ["rustls-tls", "user"]
rustls-tls = ["reqwest/rustls", "dep:rustls", "tokio-tungstenite/rustls-tls-webpki-roots"]
user = ["dep:wreq", "dep:wreq-util", "dep:totp-rs"]
