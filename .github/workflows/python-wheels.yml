name: Python wheels

# Builds every distribution uploaded to PyPI. `publish.yml` calls this workflow
# for releases, and pull requests that can affect packaging run it as well so a
# broken platform is found before a tag is pushed.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/python-wheels.yml"
      - "Cargo.lock"
      - "crates/tradingview-py/Cargo.toml"
      - "crates/tradingview-py/pyproject.toml"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string

permissions: {}

env:
  MATURIN_VERSION: v1.16.0

jobs:
  linux:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # 2026.11.07-1
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            # 2026.11.07-1
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: crates/tradingview-py
          target: ${{ matrix.target }}
          manylinux: "2_28"
          container: ${{ matrix.container }}
          # btls-sys generates its bindings with bindgen, which needs libclang.
          before-script-linux: dnf install -y clang-devel
          args: --release --locked --out dist

      # python:3.10-slim-buster ships glibc 2.28 and the oldest supported Python,
      # the floor of what the wheel's tags promise.
      - name: Import wheel on the oldest supported glibc and Python
        run: |
          docker run --rm -v "$PWD/crates/tradingview-py/dist:/dist:ro" \
            python:3.10-slim-buster@sha256:37aa274c2d001f09b14828450d903c55f821c90f225fdfdd80c5180fcca77b3f \
            sh -c 'pip install --no-index --find-links /dist tradingview-rs && python -c "import tradingview"'

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist-${{ matrix.name }}
          path: crates/tradingview-py/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  macos-windows:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: crates/tradingview-py
          target: ${{ matrix.target }}
          args: --release --locked --out dist

      - name: Import wheel on the oldest supported Python
        shell: bash
        run: |
          python -m pip install --no-index --find-links crates/tradingview-py/dist tradingview-rs
          python -c "import tradingview"

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist-${{ matrix.name }}
          path: crates/tradingview-py/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: crates/tradingview-py
          command: sdist
          args: --out dist

      - name: Install from source distribution
        run: |
          python -m pip install crates/tradingview-py/dist/*.tar.gz
          python -c "import tradingview"

      - name: Upload source distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist-sdist
          path: crates/tradingview-py/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
