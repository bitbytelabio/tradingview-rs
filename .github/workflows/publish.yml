name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Validate release version matches tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_NAME="${INPUT_TAG:-$REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            echo "::error::Tag name '$TAG_NAME' must start with 'v'" >&2
            exit 1
          fi
          TAG_VERSION="${TAG_NAME#v}"
          CRATE_VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tradingview-rs") | .version')"
          echo "Target tag: $TAG_NAME (extracted version: $TAG_VERSION)"
          echo "Cargo package version: $CRATE_VERSION"
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CRATE_VERSION)" >&2
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$CRATE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run locked package checks
        run: cargo check --locked --all-targets --all-features

      - name: Check if version is already published on crates.io
        id: check_published
        env:
          CRATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Checking whether tradingview-rs v${CRATE_VERSION} is already published on crates.io..."
          # Query crates.io API directly and outside workspace to avoid local manifest shadowing
          HTTP_STATUS="$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: bitbytelabio-tradingview-rs-release" "https://crates.io/api/v1/crates/tradingview-rs/${CRATE_VERSION}" || true)"
          if [ "$HTTP_STATUS" = "200" ] || \
             (cd /tmp && cargo search tradingview-rs --limit 10 | grep -E -q "^tradingview-rs = \"${CRATE_VERSION}\""); then
            echo "tradingview-rs v${CRATE_VERSION} is already published on crates.io; skipping crates.io publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "tradingview-rs v${CRATE_VERSION} is not published on crates.io; proceeding with publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dry-run publish
        if: steps.check_published.outputs.published != 'true'
        run: cargo publish -p tradingview-rs --dry-run --locked

      - name: Package crate and generate checksums
        run: |
          set -euo pipefail
          cargo package -p tradingview-rs --locked
          mkdir -p target/release-assets
          cp target/package/*.crate target/release-assets/
          (cd target/release-assets && sha256sum *.crate > SHA256SUMS)
          cat target/release-assets/SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: target/release-assets/
          retention-days: 7

      - name: Authenticate to crates.io (Trusted Publishing)
        if: steps.check_published.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        continue-on-error: true

      - name: Resolve crates.io publish token
        if: steps.check_published.outputs.published != 'true'
        env:
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          SECRET_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$OIDC_TOKEN" ]; then
            echo "Publishing via crates.io Trusted Publishing (OIDC token)"
            echo "CARGO_REGISTRY_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"
          elif [ -n "$SECRET_TOKEN" ]; then
            echo "Publishing via CRATES_IO_TOKEN secret fallback"
            echo "CARGO_REGISTRY_TOKEN=$SECRET_TOKEN" >> "$GITHUB_ENV"
          else
            echo "::error::Neither crates.io Trusted Publishing (OIDC) nor CRATES_IO_TOKEN secret is configured." >&2
            echo "To configure Trusted Publishing, visit https://crates.io/crates/tradingview-rs/settings/trusted-publishing" >&2
            echo "Or set the CRATES_IO_TOKEN secret in GitHub repository settings." >&2
            exit 1
          fi

      - name: Publish crate to crates.io
        if: steps.check_published.outputs.published != 'true'
        run: cargo publish -p tradingview-rs --locked

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Creating GitHub release for $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            release-assets/*.crate \
            release-assets/SHA256SUMS \
            --title "$RELEASE_TAG" \
            --target "${GITHUB_SHA}" \
            --generate-notes
